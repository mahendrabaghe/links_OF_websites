<script src="config.js"></script>
<script>
  (function () {
    var cfg = window.SITE_CONFIG || {};
    var theme = null;
    try { theme = localStorage.getItem('ph-theme'); } catch (e) {}
    if (theme !== 'dark' && theme !== 'light') {
      var pref = cfg.theme && cfg.theme.default;
      theme = (pref === 'dark' || pref === 'light')
        ? pref
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    document.documentElement.setAttribute('data-theme', theme);
    var tag = document.querySelector('meta[name="theme-color"]');
    if (tag) tag.setAttribute('content', theme === 'dark' ? '#070910' : '#eef1f8');
  })();
</script>
